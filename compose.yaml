services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huipi_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-huipi_cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-huipi_cloud_test}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-test-database.sh:/docker-entrypoint-initdb.d/01-create-test-database.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z-distroless
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-huipi-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-only-change-this-before-use}
      MINIO_HEALTHCHECK_URL: http://127.0.0.1:9000/minio/health/ready
    ports:
      - "127.0.0.1:${MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  minio_data:
