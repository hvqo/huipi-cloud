name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: huipi_cloud_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d huipi_cloud_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/huipi_cloud_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/huipi_cloud_test
      MINIO_ENDPOINT_URL: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: huipi-ci
      MINIO_SECRET_KEY: local-ci-only-change-me
      MINIO_BUCKET: huipi-cloud-ci
      MINIO_TEST_BUCKET: huipi-cloud-ci-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Start private MinIO test service
        run: |
          docker run -d --name huipi-ci-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=huipi-ci \
            -e MINIO_ROOT_PASSWORD=local-ci-only-change-me \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z-distroless \
            server /data --console-address ':9001'
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs huipi-ci-minio
          exit 1
      - name: Ruff
        run: uv run ruff check .
      - name: Apply migration to empty database
        run: uv run alembic upgrade head
      - name: Check model and migration consistency
        run: uv run alembic check
      - name: Create isolated integration-test database
        run: createdb --host 127.0.0.1 --username postgres huipi_cloud_test
        env:
          PGPASSWORD: postgres
      - name: Independent identity migration round trip
        run: uv run python scripts/check_identity_migration.py
      - name: Pytest
        run: uv run pytest
      - name: Stop MinIO test service
        if: always()
        run: docker rm -f huipi-ci-minio 2>/dev/null || true

  frontend:
    name: teacher-workbench
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: huipi_cloud_browser_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d huipi_cloud_browser_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/huipi_cloud_browser_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/huipi_cloud_browser_test
      MINIO_ENDPOINT_URL: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: huipi-ci
      MINIO_SECRET_KEY: local-ci-only-change-me
      MINIO_BUCKET: huipi-cloud-browser-ci
      MINIO_TEST_BUCKET: huipi-cloud-browser-ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        run: uv sync --locked
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Verify generated OpenAPI contract
        run: |
          uv run python scripts/export_frontend_openapi.py
          npm run api:generate --prefix frontend
          git diff --exit-code -- frontend/src/api/generated.ts
      - name: Frontend TypeScript
        run: npm run typecheck --prefix frontend
      - name: Frontend ESLint
        run: npm run lint --prefix frontend
      - name: Frontend unit and DOM tests
        run: npm run test --prefix frontend
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Offline teacher and administrator browser flows
        run: npm run e2e:demo --prefix frontend
      - name: Start private S3 and independent browser test database
        run: |
          docker run -d --name huipi-browser-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=huipi-ci \
            -e MINIO_ROOT_PASSWORD=local-ci-only-change-me \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z-distroless \
            server /data --console-address ':9001'
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres huipi_cloud_browser_test
      - name: Real browser / Mock OIDC / PostgreSQL / S3 workflow
        run: RUN_WORKBENCH_E2E=1 uv run pytest -q tests/integration/test_teacher_workbench_browser.py
      - name: Stop browser S3 service
        if: always()
        run: docker rm -f huipi-browser-minio 2>/dev/null || true
