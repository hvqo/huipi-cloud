name: Fast CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
      GRADING_ENABLED: 'false'
      VISUAL_EVIDENCE_ENABLED: 'false'
      COPILOT_ENABLED: 'false'
      GRADING_API_KEY: ''
      VISUAL_EVIDENCE_API_KEY: ''
      COPILOT_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Pure unit tests (no services or models)
        run: uv run pytest -q tests/unit
      - name: Static migration and model structure
        run: uv run python scripts/check_migration_structure.py
      - name: Patch whitespace and frontend scope
        id: changes
        shell: bash
        run: |
          git diff --check HEAD^ HEAD
          if git diff --quiet HEAD^ HEAD -- frontend/ scripts/export_frontend_openapi.py; then
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend contract and static checks (when changed)
        if: steps.changes.outputs.frontend == 'true'
        run: |
          npm ci --prefix frontend
          uv run python scripts/export_frontend_openapi.py
          npm run api:generate --prefix frontend
          git diff --exit-code -- frontend/src/api/generated.ts
          npm run typecheck --prefix frontend
          npm run lint --prefix frontend
