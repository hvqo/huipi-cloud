name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: huipi_cloud_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d huipi_cloud_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/huipi_cloud_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/huipi_cloud_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Apply migration to empty database
        run: uv run alembic upgrade head
      - name: Check model and migration consistency
        run: uv run alembic check
      - name: Create isolated integration-test database
        run: createdb --host 127.0.0.1 --username postgres huipi_cloud_test
        env:
          PGPASSWORD: postgres
      - name: Pytest
        run: uv run pytest
